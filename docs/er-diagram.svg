<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .box { fill: #fff; stroke: #222; stroke-width: 1.2px; }
    .title { font: bold 14px sans-serif; }
    .field { font: 12px monospace; }
    .edge { stroke: #333; stroke-width: 1px; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Organizations -->
  <rect class="box" x="40" y="40" width="220" height="80" rx="6"/>
  <text class="title" x="60" y="62">ORGANIZATIONS</text>
  <text class="field" x="60" y="82">uuid id PK</text>
  <text class="field" x="60" y="98">text name</text>

  <!-- Users -->
  <rect class="box" x="320" y="40" width="220" height="80" rx="6"/>
  <text class="title" x="340" y="62">USERS</text>
  <text class="field" x="340" y="82">uuid id PK</text>
  <text class="field" x="340" y="98">uuid organization_id FK</text>

  <!-- Accounts -->
  <rect class="box" x="40" y="160" width="220" height="100" rx="6"/>
  <text class="title" x="60" y="182">ACCOUNTS</text>
  <text class="field" x="60" y="202">uuid id PK</text>
  <text class="field" x="60" y="218">uuid organization_id FK</text>

  <!-- Instruments -->
  <rect class="box" x="320" y="160" width="220" height="100" rx="6"/>
  <text class="title" x="340" y="182">INSTRUMENTS</text>
  <text class="field" x="340" y="202">uuid id PK</text>
  <text class="field" x="340" y="218">uuid organization_id FK</text>

  <!-- Holdings -->
  <rect class="box" x="600" y="160" width="260" height="120" rx="6"/>
  <text class="title" x="620" y="182">HOLDINGS</text>
  <text class="field" x="620" y="202">uuid id PK</text>
  <text class="field" x="620" y="218">uuid account_id FK</text>
  <text class="field" x="620" y="234">uuid instrument_id FK</text>

  <!-- Transactions -->
  <rect class="box" x="40" y="320" width="220" height="120" rx="6"/>
  <text class="title" x="60" y="342">TRANSACTIONS</text>
  <text class="field" x="60" y="362">uuid id PK</text>
  <text class="field" x="60" y="378">uuid account_id FK</text>

  <!-- Portfolios -->
  <rect class="box" x="320" y="320" width="220" height="80" rx="6"/>
  <text class="title" x="340" y="342">PORTFOLIOS</text>
  <text class="field" x="340" y="362">uuid id PK</text>

  <!-- Documents -->
  <rect class="box" x="600" y="320" width="260" height="100" rx="6"/>
  <text class="title" x="620" y="342">DOCUMENTS</text>
  <text class="field" x="620" y="362">uuid id PK</text>
  <text class="field" x="620" y="378">uuid organization_id FK</text>

  <!-- Edges -->
  <line class="edge" x1="260" y1="80" x2="320" y2="80" />
  <text x="280" y="75" font-size="12" fill="#333">has</text>

  <line class="edge" x1="160" y1="240" x2="160" y2="320" />
  <text x="110" y="280" font-size="12" fill="#333">owns</text>

  <line class="edge" x1="440" y1="260" x2="600" y2="260" />
  <text x="500" y="255" font-size="12" fill="#333">is_in</text>

  <line class="edge" x1="160" y1="380" x2="600" y2="380" />
  <text x="380" y="375" font-size="12" fill="#333">stores</text>

  <!-- Footer note -->
  <text x="40" y="760" font-size="12" fill="#666">Generated by GitHub Copilot Chat — Mermaid source in docs/er-diagram.mmd</text>
</svg>
